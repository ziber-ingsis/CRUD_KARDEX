{% include "header.html" %}

<h2 class="mb-3">Listado de Categorías</h2>
<a href="/categorias/create" class="btn btn-success mb-3">Nuevo</a>

<table class="table">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
    {% for c in categorias %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.descripcion }}</td>
            <td>
                <a href="/categorias/edit/{{c.id}}" class="btn btn-warning">Editar</a>
                <a href="/categorias/delete/{{c.id}}" class="btn btn-danger ms-1"
                   onclick="return confirm('¿Está seguro???')">Eliminar</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% include "footer.html" %}
