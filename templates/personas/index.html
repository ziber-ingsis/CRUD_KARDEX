{% include "header.html" %}

<h2 class="mb-3">Listado de personas</h2>
<a href="/personas/create" class="btn btn-success mb-3">Nuevo</a>

<table class="table">
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Telefono</th>
            <th>Fecha nac</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
    {% for p in personas %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }} {{ p.apellido }}</td>
            <td>{{ p.telefono }}</td>
            <td>{{ p.fecha_nacimiento }}</td>
            <td>
                <a href="/personas/edit/{{p.id}}" class="btn btn-warning">Editar</a>
                <a href="/personas/delete/{{p.id}}" class="btn btn-danger ms-1"
                   onclick="return confirm('¿Está seguro???')">Eliminar</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% include "footer.html" %}
