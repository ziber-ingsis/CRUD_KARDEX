{% include "../header.html" %}

<h2 class="mb-3">Editar Persona</h2>
<form action="/personas/update" method="POST" class="card p-4">
    <input type="hidden" name="id" value="{{ persona.id }}">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ persona.nombre }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Apellido</label>
        <input type="text" name="apellido" class="form-control" value="{{ persona.apellido }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" value="{{ persona.telefono }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Fecha de Nacimiento</label>
        <input type="date" name="fecha_nacimiento" class="form-control" value="{{ persona.fecha_nacimiento }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Actualizar</button>
</form>

{% include "../footer.html" %}
